# GoldSrc.rs Localization Dictionary Template (v0.15.x)
# Dictionary Name: test_i18n (placed in data/lang/test_i18n.toml)

[config]
fallback = "en"
access = "public"

[templates]
box = "{tag} {0} @{w('(WASM i18n Demo)')}"
alert_box = "{alert_tag} {0}"

[vars]
tag = "@{tag('GoldSrc.rs')}"
alert_tag = "@{tag('Внимание')}"
reward_tag = "@{tag('Награда')}"
currency = "$"

[translations.ru.vars]
currency = "₽"

[translations.ru]
welcome_msg = "{tag} Добро пожаловать на сервер, @{g('{name='Гость'}')}! (Язык: @{t('Русский')})"
lang_info = "{tag} Текущий выбранный язык: @{g('{lang}')}. Всего записей: @{g('{count}')}."
reward_claimed = "{reward_tag} Вы получили бонус в размере @{g('{amount='1000'}')} {currency} и @{g('{xp='50'}')} XP!"
admin_alert = "{alert_tag} Администратор @{g('{admin='Server'}')} изменил карту на @{t('{map='de_dust2'}')}."
menu_title = "\\y[i18n] Главное Меню Сервера"
menu_item_hp = "Пополнить здоровье (+100 HP)"
menu_item_ap = "Пополнить броню (+100 AP)"
menu_item_m4a1 = "Выдать M4A1 Carbine"
menu_item_ak47 = "Выдать AK-47 Kalashnikov"
menu_item_awp = "Выдать AWP Sniper"
menu_item_deagle = "Выдать Desert Eagle"
menu_action_reward = "{tag} @{g('{name}')}, вы выбрали: @{t('{item}')}!"

[translations.en]
welcome_msg = "{tag} Welcome to the server, @{g('{name='Guest'}')}! (Language: @{t('English')})"
lang_info = "{tag} Currently active language: @{g('{lang}')}. Total entries: @{g('{count}')}."
reward_claimed = "@{tag('Reward')} You received a bonus of @{g('{amount='1000'}')} {currency} and @{g('{xp='50'}')} XP!"
admin_alert = "@{tag('Alert')} Administrator @{g('{admin='Server'}')} changed map to @{t('{map='de_dust2'}')}."
menu_title = "\\y[i18n] Main Server Menu"
menu_item_hp = "Restore Health (+100 HP)"
menu_item_ap = "Restore Armor (+100 AP)"
menu_item_m4a1 = "Equip M4A1 Carbine"
menu_item_ak47 = "Equip AK-47 Kalashnikov"
menu_item_awp = "Equip AWP Sniper"
menu_item_deagle = "Equip Desert Eagle"
menu_action_reward = "{tag} @{g('{name}')}, you selected: @{t('{item}')}!"

[translations.es]
