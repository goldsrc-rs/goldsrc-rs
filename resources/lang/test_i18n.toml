reward_claimed = "@{tag('Recompensa')} ¡Has recibido un bono de @{g('{amount='1000'}')} {currency} и @{g('{xp='50'}')} XP!"
admin_alert = "@{tag('Alerta')} El administrador @{g('{admin='Server'}')} cambió el mapa a @{t('{map='de_dust2'}')}."
menu_title = "\\y[i18n] Menú Principal del Servidor"
menu_item_hp = "Restaurar Salud (+100 HP)"
