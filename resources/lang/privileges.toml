# GoldSrc.rs Privileges Localization Dictionary
# Dictionary Name: privileges

[config]
fallback = "en"
access = "public"

[vars]
tag = "@{tag('VIP')}"

[translations.en]
granted_vip = "{tag} You have been granted VIP privileges!"
status_info = "{tag} Player @{g('{name}')} (#{idx}); VIP status: @{g('{status}')}."
healed = "{tag} You were healed to 100 HP!"
claimed_armor = "{tag} Received armor kit (+100 AP)."
claimed_grenades = "{tag} Received grenade set."
claimed_m4a1 = "{tag} Received M4A1 + Deagle kit."
claimed_ak47 = "{tag} Received AK-47 + Deagle kit."
claimed_awp = "{tag} Received AWP + Deagle sniper kit."
claimed_deagle = "{tag} Received Desert Eagle pistol."
awp_restricted = "{tag} AWP is only available from round @{g('{round}')}! (Current: @{g('{cur}')})"
already_claimed = "{tag} You have already claimed weapons this round!"
regen_status = "{tag} Passive HP auto-regeneration: @{g('{state}')}."

[translations.en.menus]
title = "\\y[GoldSrc] VIP Arsenal & Perks"
armor = "1. Armor Kit (+100 AP)"
grenades = "2. Grenade Pack (HE + 2 Flash + Smoke)"
m4a1 = "3. Assault Kit (M4A1 + Deagle)"
ak47 = "4. Assault Kit (AK-47 + Deagle)"
awp = "5. Sniper Kit (AWP + Deagle)"
deagle = "6. Sidearm (Desert Eagle)"
toggle_regen = "7. Toggle HP Auto-Regen"

[translations.en.errors]
unauthorized = "Access denied: missing VIP privilege '@{g('{cap}')}'."
already_claimed = "Equipment perk already claimed for this round."
round_restricted = "Perk restricted until round @{g('{allowed}')} (current: @{g('{cur}')})."

[translations.en.cvars]
bonus_hp = "Starting round HP provided to VIP players (e.g. 100)."
bonus_armor = "Starting round armor provided to VIP players (e.g. 100)."
regen_hp = "Passive health regeneration per post-think tick (0.0 to disable)."
auto_equip_round = "Minimum round number before auto equipment perks are granted."
awp_round = "Minimum round number before AWP sniper rifle selection is allowed."
chat_prefix = "Enable [VIP] prefix in global and team chat messages."
reserved_slots = "Number of player slots reserved for VIP players."

