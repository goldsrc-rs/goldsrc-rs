# GoldSrc.rs Map Manager Localization Dictionary
# Dictionary Name: map_manager

[config]
fallback = "en"
access = "public"

[vars]
tag = "@{tag('MapManager')}"

[translations.en]
timeleft_msg = "{tag} Time remaining on current map: @{g('{time}')}."
no_timelimit = "No timelimit"
current_map_msg = "{tag} Current map: @{g('{map}')}."
next_map_msg = "{tag} Next map in rotation: @{g('{map}')}."
nominated_msg = "{tag} Player @{g('{name}')} nominated map @{g('{map}')} for next vote."
already_nominated = "{tag} Map @{g('{map}')} is already nominated or recently played."
vote_started = "{tag} End-of-map vote has begun! Cast your vote in the menu."
vote_winner = "{tag} Map vote finished! Winner: @{g('{winner}')}. Changing map in 3 seconds..."

[translations.en.menus]
vote_title = "\\y[GoldSrc] Vote for Next Map"
nomination_title = "\\y[GoldSrc] Map Nomination"

[translations.en.cvars]
vote_trigger_mins = "Minutes before map end to automatically trigger end-of-map vote."
vote_duration_secs = "Duration in seconds for interactive map vote polling."
block_recent_count = "Number of recently played maps blocked from rotation and nominations."
default_pool = "Comma-separated default pool of maps in rotation."

[translations.ru]
timeleft_msg = "{tag} До конца карты осталось: @{g('{time}')}."
no_timelimit = "Без ограничений"
current_map_msg = "{tag} Текущая карта: @{g('{map}')}."
next_map_msg = "{tag} Следующая карта в ротации: @{g('{map}')}."
nominated_msg = "{tag} Игрок @{g('{name}')} номинировал карту @{g('{map}')} для голосования."
already_nominated = "{tag} Карта @{g('{map}')} уже номинирована или недавно игралась."
vote_started = "{tag} Голосование за следующую карту началось! Выберите карту в меню."
vote_winner = "{tag} Голосование завершено! Победила карта: @{g('{winner}')}. Смена через 3 секунды..."

[translations.ru.menus]
vote_title = "\\y[GoldSrc] Выбор следующей карты"
nomination_title = "\\y[GoldSrc] Номинация карт"

[translations.ru.cvars]
vote_trigger_mins = "Минуты до конца карты для автоматического запуска голосования."
vote_duration_secs = "Длительность голосования за карту в секундах."
block_recent_count = "Количество недавно сыгранных карт, заблокированных для выбора."
default_pool = "Список карт по умолчанию через запятую."
