[package]
name = "administration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical GoldSrc server, match, staff RBAC, and engine administration suite"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[package.metadata.goldsrc]
role = "coordinator"
bundle = "staff"
priority = 20
permissions = [
    "cvar:*",
    "storage:*",
    "chat:*",
    "hud:*",
    "menu:*",
    "player:*",
]

[package.metadata.goldsrc.sandbox]
memory_limit_mb = 16
table_elements = 5000
instances = 2

[dependencies]
goldsrc = { workspace = true }
goldsrc-api = { workspace = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
