[package]
name = "chat_director"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical GoldSrc communication manager, antiflood protection, staff channels, and broadcast rotators"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[package.metadata.goldsrc]
role = "service"
bundle = "gameplay"
priority = 40
permissions = [
    "cvar:*",
    "storage:*",
    "chat:*",
    "hud:*",
    "player:*",
]

[package.metadata.goldsrc.sandbox]
memory_limit_mb = 16
table_elements = 5000
instances = 2

[dependencies]
goldsrc = { workspace = true }
goldsrc-api = { workspace = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
