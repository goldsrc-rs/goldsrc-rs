# GoldSrc.rs Chat Director Localization Dictionary
# Dictionary Name: chat_director

[config]
fallback = "en"
access = "public"

[vars]
tag = "@{tag('Chat')}"

[translations.en]
flood_warning = "{tag} Stop flooding! Please wait @{g('{wait}')}s before sending next message."
staff_report_sent = "{tag} Your report has been dispatched to online staff members."
staff_report_format = "^3[Staff Channel]^1 @{g('{sender}')}: @{g('{msg}')}"
info_powered_by = "[Info] Server is running on high-performance GoldSrc.rs runtime."
info_menu_help = "[Help] Type /menu in chat to open the main server navigation hub."
info_respect_rules = "[Rules] Respect players; voice and chat spam is strictly prohibited."
info_vip_perks = "[VIP] Type /vip to access bonus equipment and round arsenal perks."

[translations.en.cvars]
flood_interval = "Minimum interval in seconds between messages to prevent spam."
broadcast_interval = "Interval in seconds between rotating informational broadcast messages."
enable_staff_channel = "Enable say_team @ prefix routing to online staff."
enable_dhud_banners = "Render rotating announcements in Director HUD banners."

[translations.ru]
flood_warning = "{tag} Прекратите флудить! Подождите @{g('{wait}')}с перед следующим сообщением."
staff_report_sent = "{tag} Ваше сообщение передано дежурным администраторам."
staff_report_format = "^3[Связь с Админами]^1 @{g('{sender}')}: @{g('{msg}')}"
info_powered_by = "[Инфо] Сервер работает под управлением высокоскоростного GoldSrc.rs."
info_menu_help = "[Помощь] Напишите /menu для вызова главного меню функций сервера."
info_respect_rules = "[Правила] Уважайте других игроков, голосовой и текстовый спам наказуем."
info_vip_perks = "[VIP] Напишите /vip для доступа к бонусам экипировки и арсеналу."

[translations.ru.cvars]
flood_interval = "Минимальный интервал в секундах между сообщениями для защиты от спама."
broadcast_interval = "Интервал в секундах между информационными объявлениями."
enable_staff_channel = "Включить отправку сообщений через say_team @ дежурным администраторам."
enable_dhud_banners = "Отображать баннеры объявлений в Director HUD."
