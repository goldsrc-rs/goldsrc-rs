[bundle]
name = "infra"
version = "0.19.0"
description = "GoldSrc Core Infrastructure Bundle (Menu Frontend + UI Services)"
author = "GoldSrc.rs Team"

[components.menu_frontend]
role = "ui"
path = "menu_frontend.wasm"
priority = 5
description = "Universal declarative menu renderer, pagination, and multi-plugin registry"

[permissions]
shared_buckets = ["infra/shared", "infra/menu"]
allowed_cvars = ["grs_menu_*"]
