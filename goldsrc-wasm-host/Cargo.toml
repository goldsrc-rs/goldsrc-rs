[package]
name = "goldsrc-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM plugin host for GoldSrc.rs (using wasm3 runtime)"

[dependencies]
goldsrc-sys = { workspace = true }
goldsrc-api = { workspace = true }
wasmi = "0.36"
log = "0.4"
notify = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
