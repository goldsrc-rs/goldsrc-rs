[package]
name = "goldsrc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Public framework (SDK) for GoldSrc.rs plugin developers"

[dependencies]
goldsrc-sys = { workspace = true }
goldsrc-api = { workspace = true, features = ["unsafe-sys"] }
goldsrc-macros = { workspace = true }
lexopt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
goldsrc-wasm-host = { workspace = true, optional = true }

[features]
# Enable the host-side management runtime and CLI.
host = ["goldsrc-wasm-host", "rusqlite", "crossbeam-channel"]
host-cli = ["host", "lexopt"]
