name: "Bug Report"
description: "File a bug report or crash analysis to help improve GoldSrc.rs"
title: "fix(<scope>): <short description of the bug>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detailed context as possible to help reproduce and fix the bug.

  - type: dropdown
    id: backend
    attributes:
      label: "Backend & Execution Environment"
      description: "Which GoldSrc.rs backend and engine runtime are you using?"
      options:
        - "Metamod Backend (goldsrc-metamod)"
        - "Standalone Backend (goldsrc-standalone)"
        - "WASM Host Sandbox (goldsrc-wasm-host)"
        - "Framework / SDK (goldsrc / goldsrc-api)"
        - "CLI / Tooling (grs / scripts)"
      default: 0
    validations:
      required: true

  - type: input
    id: engine_version
    attributes:
      label: "Engine & OS Version"
      description: "e.g., ReHLDS 3.14.0.841 (Windows 11 x64 / Debian 12 x64), HLDS 8684"
      placeholder: "ReHLDS 3.14.0.841-dev, Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running the command `...`, the server crashes / plugin panics..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the behavior."
      placeholder: |
        1. Compile and deploy plugin `...`
        2. Join the server as player #1
        3. Execute command `...` in console
        4. See error / panic in server console
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: "The plugin should handle the command without timeout or memory corruption..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Crash Dumps / Backtraces"
      description: "Please paste server console logs, WASM backtraces, or WinDbg / GDB crash stack traces."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Validation Checklist"
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
        - label: "I am using the latest commit from `dev` or the latest release."
          required: true
