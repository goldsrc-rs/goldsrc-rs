name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM (if missing)
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\lib")) {
            winget install LLVM.LLVM --accept-package-agreements --accept-source-agreements
          }

      - name: Setup references
        run: python -m scripts setup

      - name: Build
        run: cargo build --target i686-pc-windows-msvc --workspace
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\lib

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --target i686-pc-windows-msvc --workspace -- -D warnings

      - name: Run tests (host target)
        run: cargo test --workspace

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install 32-bit build tools & Clang
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libclang-dev

      - name: Setup references
        run: python -m scripts setup

      - name: Build
        run: cargo build --target i686-unknown-linux-gnu --workspace
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --target i686-unknown-linux-gnu --workspace -- -D warnings

      - name: Run tests (host target)
        run: cargo test --workspace
