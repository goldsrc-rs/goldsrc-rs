name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt-check:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-D warnings -C debuginfo=0"
      LIBCLANG_PATH: 'C:\Program Files\LLVM\lib'
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install LLVM
        run: choco install llvm --no-progress -y

      - name: Setup references (minimal CI)
        run: python -m scripts setup --ci

      - name: Run clippy
        run: cargo clippy --target i686-pc-windows-msvc --workspace --locked -- -D warnings

      - name: Run unit tests with nextest
        run: cargo nextest run --target i686-pc-windows-msvc --workspace --locked

      - name: Run doc tests
        run: cargo test --doc --target i686-pc-windows-msvc --workspace --locked

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C debuginfo=0 -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install 32-bit build tools, Clang & Mold
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libclang-dev mold

      - name: Set LIBCLANG_PATH dynamically
        run: |
          LLVM_LIB=$(llvm-config --libdir 2>/dev/null || echo "")
          CLANG_PATH=$(find /usr/lib/llvm* /usr/lib/x86_64-linux-gnu -name "libclang.so*" -exec dirname {} \; 2>/dev/null | head -n 1)
          TARGET_LIB="${CLANG_PATH:-$LLVM_LIB}"
          echo "Found libclang path: $TARGET_LIB"
          echo "LIBCLANG_PATH=$TARGET_LIB" >> $GITHUB_ENV

      - name: Setup references (minimal CI)
        run: python -m scripts setup --ci

      - name: Run clippy
        run: cargo clippy --target i686-unknown-linux-gnu --workspace --locked -- -D warnings

      - name: Run unit tests with nextest
        run: cargo nextest run --target i686-unknown-linux-gnu --workspace --locked

      - name: Run doc tests
        run: cargo test --doc --target i686-unknown-linux-gnu --workspace --locked
