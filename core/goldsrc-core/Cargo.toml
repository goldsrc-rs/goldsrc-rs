[package]
name = "goldsrc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side runtime orchestrator, engine bridge, configuration, storage, and hook dispatcher for GoldSrc.rs"

[dependencies]
goldsrc-sys = { workspace = true }
goldsrc-api = { workspace = true, features = ["unsafe-sys"] }
goldsrc-host-wasm = { workspace = true }
lexopt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true }
crossbeam-channel = { workspace = true }
notify = { workspace = true }
libloading = { workspace = true }

[features]
default = ["cli"]
cli = ["lexopt"]
