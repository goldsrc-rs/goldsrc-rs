[workspace]
members = [
    "core/goldsrc-sys",
    "core/goldsrc-api",
    "core/goldsrc-spi",
    "core/goldsrc-core",
    "backends/goldsrc-backend-metamod",
    "backends/goldsrc-backend-standalone",
    "hosts/goldsrc-host-wasm",
    "extensions/goldsrc-extension-reapi",
    "extensions/goldsrc-extension-metamod",
    "framework/goldsrc",
    "framework/goldsrc-macros",
    "plugins/admin_system",
    "plugins/vip_core",
    "examples/test_chat",
    "examples/test_ecs",
    "examples/test_hud",
    "examples/test_i18n",
    "examples/test_menu",
]
default-members = [
    "core/goldsrc-sys",
    "core/goldsrc-api",
    "core/goldsrc-spi",
    "core/goldsrc-core",
    "backends/goldsrc-backend-metamod",
    "backends/goldsrc-backend-standalone",
    "hosts/goldsrc-host-wasm",
    "extensions/goldsrc-extension-reapi",
    "extensions/goldsrc-extension-metamod",
    "framework/goldsrc",
    "framework/goldsrc-macros",
]
resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "High-performance modular Rust framework for GoldSrc / Half-Life engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc-rs"

[workspace.dependencies]
goldsrc-sys = { path = "core/goldsrc-sys", version = "0.17.0" }
goldsrc-api = { path = "core/goldsrc-api", version = "0.17.0" }
goldsrc-spi = { path = "core/goldsrc-spi", version = "0.17.0" }
goldsrc-core = { path = "core/goldsrc-core", version = "0.17.0" }
goldsrc-extension-reapi = { path = "extensions/goldsrc-extension-reapi", version = "0.17.0" }
goldsrc-extension-metamod = { path = "extensions/goldsrc-extension-metamod", version = "0.17.0" }
goldsrc-backend-metamod = { path = "backends/goldsrc-backend-metamod", version = "0.17.0" }
goldsrc-backend-standalone = { path = "backends/goldsrc-backend-standalone", version = "0.17.0" }
goldsrc-host-wasm = { path = "hosts/goldsrc-host-wasm", version = "0.17.0" }
goldsrc = { path = "framework/goldsrc", version = "0.17.0" }
goldsrc-macros = { path = "framework/goldsrc-macros", version = "0.17.0" }

wasmtime = { version = "48.0", default-features = false, features = [
    "cranelift",
    "pulley",
    "component-model",
    "runtime",
    "std",
] }
wit-bindgen = "0.62.0"
wit-component = "0.259.0"
wit-parser = "0.259.0"
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
lexopt = "0.3"
libloading = "0.9.0"
libc = "0.2"
thiserror = "2.0"
log = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
crossbeam-channel = "0.5"
semver = "1.0"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
panic = "unwind"

# NOTE: `panic` must stay "unwind" — `catch_ffi_panic` (catch_unwind) relies on
# unwinding to stop Rust panics at the C-ABI boundary before they kill HLDS.
[profile.release]
lto = "thin"
opt-level = "z"
strip = "debuginfo"
codegen-units = 16
panic = "unwind"
