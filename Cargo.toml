[workspace]
members = [
    "goldsrc-sys",
    "goldsrc-api",
    "goldsrc-metamod-backend",
    "goldsrc-wasm-host",
    "goldsrc", "goldsrc-macros", "examples/demo_plugins/vip_core", "examples/demo_plugins/vip_menu", "examples/demo_plugins/test_suite",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ulquiorracode/GoldSrc.rs"

[workspace.dependencies]
goldsrc-sys = { path = "goldsrc-sys", version = "0.1.0" }
goldsrc-api = { path = "goldsrc-api", version = "0.1.0" }
goldsrc-metamod-backend = { path = "goldsrc-metamod-backend", version = "0.1.0" }
goldsrc-wasm-host = { path = "goldsrc-wasm-host", version = "0.1.0" }
goldsrc = { path = "goldsrc", version = "0.1.0" }
goldsrc-macros = { path = "goldsrc-macros", version = "0.1.0" }
