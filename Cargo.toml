[workspace]
members = [
    "core/goldsrc-sys",
    "core/goldsrc-api",
    "backends/goldsrc-metamod",
    "backends/goldsrc-standalone",
    "hosts/goldsrc-wasm-host",
    "framework/goldsrc",
    "framework/goldsrc-macros",
    "examples/demo_plugins/vip_core",
    "examples/demo_plugins/vip_menu",
    "examples/demo_plugins/test_hud",
    "examples/demo_plugins/test_menu",
    "examples/demo_plugins/test_ecs",
    "examples/demo_plugins/admin_system",
]
default-members = [
    "core/goldsrc-sys",
    "core/goldsrc-api",
    "backends/goldsrc-metamod",
    "backends/goldsrc-standalone",
    "hosts/goldsrc-wasm-host",
    "framework/goldsrc",
    "framework/goldsrc-macros",
]
resolver = "3"

[workspace.package]
version = "0.14.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "High-performance modular Rust framework for GoldSrc / Counter-Strike 1.6 engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc-rs"

[workspace.dependencies]
goldsrc-sys = { path = "core/goldsrc-sys", version = "0.14.0" }
goldsrc-api = { path = "core/goldsrc-api", version = "0.14.0" }
goldsrc-metamod = { path = "backends/goldsrc-metamod", version = "0.14.0" }
goldsrc-standalone = { path = "backends/goldsrc-standalone", version = "0.14.0" }
goldsrc-wasm-host = { path = "hosts/goldsrc-wasm-host", version = "0.14.0" }
goldsrc = { path = "framework/goldsrc", version = "0.14.0" }
goldsrc-macros = { path = "framework/goldsrc-macros", version = "0.14.0" }
wasmtime = { version = "48.0", default-features = false, features = [
    "cranelift",
    "pulley",
    "component-model",
    "runtime",
    "std",
] }
wit-bindgen = "0.61.1"
wit-component = "0.258.0"
wit-parser = "0.258.0"
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
lexopt = "0.3"
libloading = "0.9.0"
libc = "0.2"
thiserror = "2.0"
log = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
crossbeam-channel = "0.5"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

# NOTE: `panic` must stay "unwind" — `catch_ffi_panic` (catch_unwind) relies on
# unwinding to stop Rust panics at the C-ABI boundary before they kill HLDS.
[profile.release]
lto = "thin"
opt-level = "z"
strip = "debuginfo"
codegen-units = 16
